<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝึกศัพท์จีน — ร้านค้า / POS / KCC_POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="flashcards.css">
</head>

<body>
  <div class="wrap">
    <h1>ฝึกศัพท์จีน</h1>
    <p class="sub">ร้านค้า · ระบบ POS · งาน KCC_POS — แตะการ์ดเพื่อพลิกดูคำแปล</p>

    <div data-navbar></div>

    <div class="stats">
      <span>คำที่ <b id="pos-cur">0</b> / <b id="pos-total">0</b></span>
      <span>จำได้แล้ว <b id="known-count">0</b></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="chips" id="chips"></div>

    <div id="stage-holder">
      <div class="stage">
        <div class="tag" id="tag">
          <div class="hole"></div>
          <span class="cat-label" id="cat-label"></span>
          <div class="face front">
            <div class="hanzi" id="hanzi"></div>
            <div class="pinyin" id="pinyin"></div>
           
            <div class="hint">แตะเพื่อดูคำแปล</div>
          </div>
          <div class="face back">
            <div class="thai" id="thai"></div>
            <div class="hanzi-small" id="hanzi-back"></div>
          </div>
        </div>
        <div class="speak-row">
          <button class="speak-btn" id="btn-speak-front" title="ฟังเสียงด้านหน้า">🔊 ฟังเสียง</button>
          <!-- <button class="speak-btn" id="btn-speak-back" title="ฟังเสียงด้านหลัง">🔊 ด้านหลัง</button> -->
        </div>
      </div>

      <div class="controls">
        <button class="btn-unknow" id="btn-unknow">ยังไม่รู้ ✗</button>
        <button class="btn-know" id="btn-know">จำได้แล้ว ✓</button>
      </div>
      <div class="navrow">
        <button id="btn-prev">ก่อนหน้า</button>
        <button id="btn-shuffle">สลับลำดับ</button>
        <button id="btn-next">ถัดไป</button>
      </div>
    </div>

    <div class="utility-row" style="margin-bottom:10px;">
      <label><input type="checkbox" id="filter-unknown"> แสดงเฉพาะที่ยังไม่รู้</label>
      <label><input type="checkbox" id="auto-speak"> เล่นเสียงอัตโนมัติ</label>
    </div>
    <div class="utility-row">
      <span></span>
      <button class="link-btn" id="btn-reset">ล้างความคืบหน้า</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar.js"></script>
  <script src="flashcards.js"></script>
</body>

</html>
