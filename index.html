<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练字 ฝึกเขียนจีน HSK 1-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sheet">
  <header>
    <div class="cn">练字生字</div>
    <div class="th">สุ่มคำศัพท์จีน HSK 1-3 · ฝึกเขียนบนตารางหัดเขียน</div>
  </header>
  <div class="rule"></div>

  <div class="levels" id="levelBtns">
    <button class="lvl-btn active" data-lvl="all">ทั้งหมด</button>
    <button class="lvl-btn" data-lvl="1">HSK 1</button>
    <button class="lvl-btn" data-lvl="2">HSK 2</button>
    <button class="lvl-btn" data-lvl="3">HSK 3</button>
  </div>

  <div class="modes" id="modeBtns" aria-label="โหมดฝึก">
    <button class="mode-btn active" data-mode="normal" aria-pressed="true">ดูคำศัพท์</button>
    <button class="mode-btn" data-mode="pinyin" aria-pressed="false">ทบทวน Pinyin</button>
  </div>

  <div class="source-switch" id="sourceBtns" aria-label="แหล่งคำสุ่ม">
    <button class="source-btn active" data-source="system" aria-pressed="true">สุ่มจาก HSK</button>
    <button class="source-btn" data-source="custom" aria-pressed="false">เลือกคำเอง</button>
  </div>

  <section class="custom-panel" id="customPanel" hidden>
    <div class="custom-heading">
      <strong>รายการคำสำหรับสุ่ม</strong>
      <span id="selectedCount">เลือกแล้ว 0 คำ</span>
    </div>
    <div class="custom-actions">
      <button class="text-btn" id="selectAllBtn" type="button">เลือกทั้งหมด</button>
      <button class="text-btn" id="clearSelectionBtn" type="button">ล้างการเลือก</button>
    </div>
    <input class="word-search" id="wordSearch" type="search" placeholder="ค้นหาคำจีนในระบบ..." aria-label="ค้นหาคำจีนในระบบ">
    <div class="word-list" id="wordList"></div>
    <label class="custom-label" for="customWords">เพิ่มคำเอง (บรรทัดละ 1 คำ)</label>
    <textarea id="customWords" rows="3" placeholder="例如 | lìrú | ตัวอย่าง&#10;学习 | xuéxí | เรียน, ศึกษา"></textarea>
    <p class="custom-hint">รูปแบบ: 汉字 | pinyin | ความหมาย โดย pinyin และความหมายเป็นตัวเลือก</p>
    <button class="btn seal apply-btn" id="applyCustomBtn" type="button">ใช้รายการนี้สุ่ม</button>
    <p class="custom-status" id="customStatus" role="status"></p>
  </section>

  <div class="card" id="practiceCard">
    <div class="word-head">
      <div class="hanzi" id="hanzi">你好</div>
      <div class="pinyin" id="pinyin">nǐ hǎo</div>
      <div class="meaning" id="meaning">สวัสดี</div>
      <div class="badge" id="levelBadge">HSK 1</div>
    </div>

    <div class="grids" id="grids"></div>

    <div class="toggle-row">
      <input type="checkbox" id="traceToggle" checked>
      <label for="traceToggle">แสดงตัวอักษรจางๆ ให้ลากตาม</label>
    </div>

    <div class="controls">
      <button class="btn ghost" id="clearBtn">ล้างที่เขียน</button>
      <button class="btn seal" id="randomBtn">สุ่มคำใหม่ 印</button>
    </div>
  </div>

  <footer>ลากนิ้วหรือเมาส์บนตารางเพื่อฝึกเขียนตามเส้นตัวอักษร</footer>
</div>
<script src="script.js"></script>
</body>
</html>
