<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>เพิ่มคำศัพท์จีน</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="../css/add-word.css">
</head>
<body>
	<main class="add-word-page">
		<header class="page-header">
			<div class="cn">新增词语</div>
			<div class="th">เพิ่มคำศัพท์จีนของคุณเอง</div>
		</header>
		<div class="rule"></div>
		<div data-navbar></div>

		<section class="form-card" aria-labelledby="formTitle">
			<div class="form-content">
				<h1 class="card-title" id="formTitle">เพิ่มคำใหม่</h1>
				<p class="card-hint">คำที่เพิ่มจะถูกเก็บไว้ในเครื่อง และนำไปสุ่มฝึกเขียนได้ทันที</p>
				<form id="wordForm">
					<label class="field" for="hanzi">
						<span class="field-label">ตัวอักษรจีน <strong>*</strong></span>
						<input id="hanzi" name="hanzi" type="text" placeholder="例如 学习" required maxlength="12" autocomplete="off">
					</label>
					<div class="field-row">
						<label class="field" for="pinyin">
							<span class="field-label">Pinyin</span>
							<input id="pinyin" name="pinyin" type="text" placeholder="xuéxí" autocomplete="off">
						</label>
						<label class="field" for="level">
							<span class="field-label">ระดับ</span>
							<select id="level" name="level">
								<option value="">คำของฉัน</option>
								<option value="1">HSK 1</option>
								<option value="2">HSK 2</option>
								<option value="3">HSK 3</option>
							</select>
						</label>
					</div>
					<label class="field" for="meaning">
						<span class="field-label">ความหมาย</span>
						<input id="meaning" name="meaning" type="text" placeholder="เรียน, ศึกษา" autocomplete="off">
					</label>
					<div class="form-actions">
						<button class="btn" type="reset">ล้างฟอร์ม</button>
						<button class="btn seal" type="submit">บันทึกคำนี้</button>
					</div>
					<p class="status" id="formStatus" role="status" aria-live="polite"></p>
				</form>
			</div>
		</section>

		<section class="saved-card" aria-labelledby="savedTitle">
			<div class="saved-header">
				<h2 id="savedTitle">คำที่เพิ่มไว้</h2>
				<span class="saved-count" id="savedCount">0 คำ</span>
				<button class="clear-btn" id="clearWords" type="button">ล้างทั้งหมด</button>
			</div>
			<div class="saved-list" id="savedWords"></div>
		</section>
	</main>
	<script src="../js/navbar.js"></script>
	<script src="../js/add-word.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
