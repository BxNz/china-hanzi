<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>เพิ่มคำศัพท์จีน - PHP & MySQL DB</title>
	<link rel="icon" href="../favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="../css/add-word.css">
</head>
<body>
	<main class="add-word-page">
		<header class="page-header">
			<div class="cn">新增词语</div>
			<div class="th">เพิ่มและจัดการคำศัพท์จีนใน MySQL Database</div>
		</header>
		<div class="rule"></div>
		<div data-navbar></div>

		<section class="login-card" id="loginPanel" aria-labelledby="loginTitle">
			<h1 class="card-title" id="loginTitle">เข้าสู่ระบบเพื่อจัดการคำศัพท์</h1>
			<p class="card-hint">กรุณาเข้าสู่ระบบด้วยบัญชีผู้ดูแลระบบ</p>
			<form id="loginForm">
				<label class="field" for="username">
					<span class="field-label">ชื่อผู้ใช้</span>
					<input id="username" name="username" type="text" required autocomplete="username">
				</label>
				<label class="field" for="password">
					<span class="field-label">รหัสผ่าน</span>
					<input id="password" name="password" type="password" required autocomplete="current-password">
				</label>
				<button class="btn seal login-submit" type="submit">เข้าสู่ระบบ</button>
				<p class="status" id="loginStatus" role="status" aria-live="polite"></p>
			</form>
		</section>

		<div id="managementPanel" hidden>
			<div class="account-bar">
				<span>เข้าสู่ระบบเป็น <strong id="accountName"></strong></span>
				<button class="text-btn" id="logoutButton" type="button">ออกจากระบบ</button>
			</div>
			<div class="status-container">
				<div id="dbBadge" class="db-badge">กำลังเชื่อมต่อ MySQL Database...</div>
			</div>

		<section class="form-card" aria-labelledby="formTitle">
			<div class="form-content">
				<h1 class="card-title" id="formTitle">เพิ่มคำใหม่เข้าคลัง DB</h1>
				<p class="card-hint">คำที่บันทึกจะถูกเก็บลงในฐานข้อมูล MySQL และนำไปสุ่มฝึกเขียนได้ทันที</p>
				<form id="wordForm">
					<label class="field" for="hanzi">
						<span class="field-label">ตัวอักษรจีน <strong>*</strong></span>
						<input id="hanzi" name="hanzi" type="text" placeholder="例如 学习" required maxlength="12" autocomplete="off">
					</label>
					<div class="field-row">
						<label class="field" for="pinyin">
							<span class="field-label">Pinyin</span>
							<input id="pinyin" name="pinyin" type="text" placeholder="xuéxí" autocomplete="off">
						</label>
						<label class="field" for="level">
							<span class="field-label">ระดับ HSK (เว้นว่างสำหรับคำ Custom)</span>
							<input id="level" name="level" type="number" min="1" step="1" placeholder="กรอกระดับ เช่น 4">
						</label>
					</div>
					<label class="field" for="category">
						<span class="field-label">หมวดแฟลชการ์ด</span>
						<select id="category" name="category"></select>
					</label>
					<label class="field" for="meaning">
						<span class="field-label">ความหมาย</span>
						<input id="meaning" name="meaning" type="text" placeholder="เรียน, ศึกษา" autocomplete="off">
					</label>
					<div class="form-actions">
						<button class="btn" type="reset">ล้างฟอร์ม</button>
						<button class="btn seal" type="submit">💾 บันทึกลง MySQL DB</button>
					</div>
					<p class="status" id="formStatus" role="status" aria-live="polite"></p>
				</form>
			</div>
		</section>

		<section class="saved-card" aria-labelledby="savedTitle">
			<div class="saved-header">
				<h2 id="savedTitle">รายการคำศัพท์ในฐานข้อมูล DB</h2>
				<span class="saved-count" id="savedCount">0 คำ</span>
			</div>
			<div class="search-bar-container">
				<input id="searchWordInput" type="search" class="form-control search-input" placeholder="🔍 ค้นหาคำศัพท์ พินอิน หรือความหมายใน DB...">
			</div>
			<div class="saved-list" id="savedWords"></div>
		</section>
		</div>
	</main>
	<script src="../js/navbar.js?v=1.0.1"></script>
	<script src="../js/add-word.js?v=1.0.2"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
