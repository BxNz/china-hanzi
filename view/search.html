<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหาคำศัพท์จีน</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/search.css">
</head>
<body>
  <main class="lookup">
    <header class="lookup-header">
      <div class="lookup-title" lang="zh">查找词语</div>
      <h1>ค้นหาคำศัพท์จีน</h1>
      <p>พิมพ์คำจีน พินอิน หรือความหมาย เพื่อค้นหาคำที่นึกไม่ออก</p>
    </header>

    <div data-navbar></div>

    <section class="lookup-panel" aria-label="ค้นหาคำศัพท์">
      <label class="visually-hidden" for="wordQuery">ค้นหาคำจีน พินอิน หรือความหมาย</label>
      <input id="wordQuery" type="search" autocomplete="off" placeholder="ลองค้นหา เช่น 学习, xuexi หรือ เรียน" aria-describedby="searchHelp">
      <p class="search-help" id="searchHelp">ค้นหาได้จากตัวอักษรจีน พินอิน (ไม่ต้องใส่วรรณยุกต์) และความหมายภาษาไทย</p>
      <div class="results-heading">
        <span id="resultStatus" role="status" aria-live="polite">กำลังโหลดคำศัพท์...</span>
      </div>
      <ul class="word-results" id="wordResults" aria-label="ผลการค้นหา"></ul>
    </section>
  </main>

  <script src="../js/navbar.js?v=1.0.2"></script>
  <script src="../js/search.js?v=1.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
